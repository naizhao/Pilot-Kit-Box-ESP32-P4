<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilot Kit · Traffic 雷达页 交互原型</title>
<style>
  :root{
    --cyan:#00d2eb; --white:#ebebeb; --grey:#787880; --dim:#37373c;
    --amber:#ffb000; --mag:#ff2fd0; --bg:#0a0c10; --panel:#14161c;
    --green:#3cdc5a; --red:#ff4d4d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#05060a; color:var(--white);
    font-family:"SF Mono",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
    display:flex; gap:28px; flex-wrap:wrap; justify-content:center;
    padding:28px; min-height:100vh;
  }
  h1{font-size:15px;font-weight:600;letter-spacing:.5px;margin-bottom:4px}
  .sub{font-size:11px;color:var(--grey);margin-bottom:18px;line-height:1.5}
  .screen-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  #radar{
    width:640px;height:480px;background:#070a10;border:1px solid #232730;
    border-radius:6px;box-shadow:0 0 40px rgba(0,210,235,.06);cursor:grab;
  }
  #radar:active{cursor:grabbing}
  .screen-note{font-size:10px;color:var(--grey)}
  .controls{
    width:300px;background:var(--panel);border:1px solid #232730;border-radius:8px;
    padding:18px;display:flex;flex-direction:column;gap:16px;height:fit-content;
  }
  .ctl-group{display:flex;flex-direction:column;gap:7px}
  .ctl-label{font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.8px}
  .seg{display:flex;border:1px solid var(--dim);border-radius:6px;overflow:hidden}
  .seg button{
    flex:1;background:transparent;color:var(--grey);border:none;padding:8px 4px;
    font:inherit;font-size:12px;cursor:pointer;transition:.15s;
  }
  .seg button.on{background:var(--cyan);color:#04141a;font-weight:600}
  .seg button:not(.on):hover{background:#1d2028;color:var(--white)}
  input[type=range]{width:100%;accent-color:var(--cyan)}
  .val{font-size:13px;color:var(--cyan);font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--white);cursor:pointer}
  .chk input{accent-color:var(--amber);width:15px;height:15px}
  .detail{
    background:#0c0e13;border:1px solid var(--dim);border-radius:6px;padding:12px;
    font-size:12px;line-height:1.7;min-height:120px;
  }
  .detail .dt-cs{font-size:15px;color:var(--cyan);font-weight:700;letter-spacing:1px}
  .detail .dt-type{color:var(--amber)}
  .detail .muted{color:var(--grey)}
  .detail table{width:100%;border-collapse:collapse;margin-top:6px}
  .detail td{padding:1px 0}
  .detail td:last-child{text-align:right;color:var(--white)}
  .detail td:first-child{color:var(--grey)}
  .hint{font-size:10px;color:var(--grey);line-height:1.6}
  a.dl{color:var(--cyan);font-size:11px;text-decoration:none}
</style>
</head>
<body>

<div class="screen-wrap">
  <div>
    <h1>Traffic 雷达页 · 交互原型</h1>
    <div class="sub">照 spec 设计 · 320×240 放大 2×<br>
      拖动盘面旋转本机航向，点目标看详情</div>
  </div>
  <canvas id="radar" width="1280" height="960"></canvas>
  <div class="screen-note">青菱形=其它飞机 · 数字=相对高度(百ft) · ^/v=升降 · 白三角=本机</div>
</div>

<div class="controls">
  <div class="ctl-group">
    <span class="ctl-label">地图朝向</span>
    <div class="seg" id="seg-orient">
      <button data-v="heading" class="on">HEADING-UP</button>
      <button data-v="north">NORTH-UP</button>
    </div>
  </div>

  <div class="ctl-group">
    <div class="row"><span class="ctl-label">本机磁航向</span><span class="val" id="hdg-val">045°</span></div>
    <input type="range" id="hdg" min="0" max="359" value="45">
    <div class="hint">= IMU yaw_deg（磁航向）。也可直接拖盘面。</div>
  </div>

  <div class="ctl-group">
    <span class="ctl-label">量程</span>
    <div class="seg" id="seg-range">
      <button data-v="2">2 NM</button>
      <button data-v="5" class="on">5 NM</button>
      <button data-v="10">10 NM</button>
      <button data-v="20">20 NM</button>
    </div>
  </div>

  <div class="ctl-group">
    <div class="row"><span class="ctl-label">磁偏角 (东+)</span><span class="val" id="var-val">−6°</span></div>
    <input type="range" id="magvar" min="-20" max="20" value="-6">
    <div class="hint">演示磁差修正：把目标真北方位降到磁系。中国大陆约 −3~−6°。拉到 0 = 不修正。</div>
  </div>

  <div class="ctl-group">
    <label class="chk"><input type="checkbox" id="show-fov"> 高亮 HSI 可见扇区 (前方 ±95°)</label>
    <label class="chk"><input type="checkbox" id="show-true"> 同时画真北目标(灰,对比磁差)</label>
  </div>

  <div class="ctl-group">
    <span class="ctl-label">选中目标</span>
    <div class="detail" id="detail"></div>
  </div>

  <div class="hint">
    本机居中 · 罗盘 N=磁北（与飞行员罗盘一致）<br>
    North-up 时本机三角随航向旋转标记朝向。
  </div>
</div>

<script>
// ---- 模拟目标：真北方位 brg_true(°)、距离 nm、相对高度 ft、升降 fpm、呼号、机型... ----
const TARGETS = [
  {brgTrue: 30,  dist: 4.2, relAlt:+1500, vs:+1200, cs:"CES2891", type:"A320", desc:"L2J", model:"AIRBUS A320",     reg:"B-1234", gs:438},
  {brgTrue: 150, dist: 7.8, relAlt:-800,  vs:-900,  cs:"CCA901",  type:"B738", desc:"L2J", model:"BOEING 737-800",  reg:"B-5678", gs:401},
  {brgTrue: 250, dist: 9.1, relAlt:+200,  vs:0,     cs:"CSN3101", type:"A333", desc:"L2J", model:"AIRBUS A330-300", reg:"B-9012", gs:455},
  {brgTrue: 320, dist: 5.5, relAlt:-1200, vs:-1500, cs:"CHH7301", type:"B789", desc:"L2J", model:"BOEING 787-9",    reg:"B-3456", gs:472},
  {brgTrue: 75,  dist: 1.8, relAlt:0,     vs:0,     cs:"N172SP",  type:"C172", desc:"L1P", model:"CESSNA 172",      reg:"N172SP", gs:98},
];

const cv = document.getElementById('radar');
const ctx = cv.getContext('2d');
const DPR = 2;
const W = 640, H = 480;
ctx.scale(DPR, DPR);

const state = {
  orient:'heading', hdg:45, range:5, magvar:-6,
  showFov:false, showTrue:false, selected:null,
};

const CX = 320, CY = 256, RMAX = 188;
const norm360 = a => ((a % 360) + 360) % 360;
const norm180 = a => { a = norm360(a); return a > 180 ? a - 360 : a; };

function targetGeom(t){
  const brgMag = norm360(t.brgTrue - state.magvar);
  const rel    = norm180(brgMag - state.hdg);
  return {brgMag, rel};
}
function place(screenAngle, radius){
  const a = (screenAngle - 90) * Math.PI/180;
  return [CX + radius*Math.cos(a), CY + radius*Math.sin(a)];
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#070a10'; ctx.fillRect(0,0,W,H);

  // 顶栏
  ctx.fillStyle = '#0c0f15'; ctx.fillRect(0,0,W,36);
  ctx.fillStyle = '#ebebeb'; ctx.font = '600 17px monospace'; ctx.textBaseline='middle';
  ctx.textAlign='left'; ctx.fillText('TRAFFIC', 14, 19);
  ctx.fillStyle = '#00d2eb'; ctx.textAlign='center';
  ctx.fillText('HDG ' + String(Math.round(state.hdg)).padStart(3,'0') + '°', W/2, 19);
  ctx.fillStyle = '#787880'; ctx.textAlign='right';
  ctx.fillText('TFC ' + TARGETS.length, W-14, 19);

  // HSI 可见扇区
  if(state.showFov){
    ctx.save(); ctx.beginPath(); ctx.moveTo(CX,CY);
    let s,e;
    if(state.orient==='heading'){ s=-95; e=95; } else { s=state.hdg-95; e=state.hdg+95; }
    ctx.arc(CX,CY,RMAX,(s-90)*Math.PI/180,(e-90)*Math.PI/180);
    ctx.closePath(); ctx.fillStyle='rgba(0,210,235,0.05)'; ctx.fill(); ctx.restore();
  }

  // 距离环
  const rings = {2:[1,2],5:[1,3,5],10:[2,5,10],20:[5,10,20]}[state.range];
  ctx.strokeStyle = '#22262e'; ctx.lineWidth = 1;
  ctx.font='11px monospace'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  rings.forEach(nm=>{
    const r = nm/state.range*RMAX;
    ctx.beginPath(); ctx.arc(CX,CY,r,0,2*Math.PI); ctx.stroke();
    ctx.fillStyle = '#3a3d44'; ctx.fillText(nm, CX+3, CY-r-2);
  });

  // 罗盘外圈 (N=磁北)
  const cards=[[0,'N'],[90,'E'],[180,'S'],[270,'W']];
  ctx.font='600 15px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  cards.forEach(([deg,lbl])=>{
    let sa=(state.orient==='heading')?norm180(deg-state.hdg):deg;
    const [x,y]=place(sa,RMAX+14);
    ctx.fillStyle=(lbl==='N')?'#cfd3dc':'#8a8e98'; ctx.fillText(lbl,x,y);
  });
  ctx.strokeStyle='#2c3038';
  for(let d=0; d<360; d+=30){
    let sa=(state.orient==='heading')?norm180(d-state.hdg):d;
    const [x1,y1]=place(sa,RMAX); const [x2,y2]=place(sa,RMAX-(d%90===0?9:5));
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // 目标
  TARGETS.forEach((t,i)=>{
    const g=targetGeom(t);
    const r=Math.min(t.dist/state.range,1)*RMAX;
    const beyond=t.dist>state.range;
    const sa=(state.orient==='heading')?g.rel:g.brgMag;

    if(state.showTrue){
      const saT=(state.orient==='heading')?norm180(t.brgTrue-state.hdg):t.brgTrue;
      const [gx,gy]=place(saT,beyond?RMAX:r);
      drawDiamond(gx,gy,6,'#4a4d55',beyond);
    }

    const [x,y]=place(sa, beyond?RMAX:r);
    const sel=state.selected===i;
    const col=sel?'#ffffff':'#00d2eb';
    drawDiamond(x,y,sel?8:6.5,col,beyond);

    ctx.font='11px monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    const arrow=t.vs>50?'^':(t.vs<-50?'v':'-');
    const altTag=(t.relAlt>=0?'+':'−')+String(Math.abs(Math.round(t.relAlt/100))).padStart(2,'0');
    ctx.fillStyle=sel?'#ffffff':'#cfd3dc'; ctx.fillText(altTag+arrow,x+11,y-5);
    ctx.fillStyle='#6f7278'; ctx.fillText(t.cs,x+11,y+7);
    t._sx=x; t._sy=y;
  });

  // 后方计数
  if(state.orient==='heading' && state.showFov){
    const behind=TARGETS.filter(t=>Math.abs(targetGeom(t).rel)>95).length;
    if(behind>0){
      ctx.fillStyle='#7a5a3a'; ctx.font='11px monospace'; ctx.textAlign='center';
      ctx.fillText('▼ 后方 '+behind+' 架(HSI 看不到)',CX,H-12);
    }
  }

  // 本机三角
  drawOwnShip(CX,CY,(state.orient==='heading')?0:state.hdg);
}

function drawDiamond(x,y,s,col,hollow){
  ctx.beginPath();
  ctx.moveTo(x,y-s); ctx.lineTo(x+s,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s,y); ctx.closePath();
  if(hollow){ ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.stroke(); }
  else { ctx.fillStyle=col; ctx.fill(); }
}
function drawOwnShip(x,y,rotDeg){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rotDeg*Math.PI/180);
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-2,-9,4,18);
  ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(-4,-9); ctx.lineTo(4,-9); ctx.closePath(); ctx.fill();
  ctx.fillRect(-13,-2,26,4);
  ctx.fillRect(-6,7,12,3);
  ctx.restore();
}

// ---- 安全 DOM 构建详情（无 innerHTML）----
function el(tag,cls,text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function renderDetail(){
  const d=document.getElementById('detail'); d.replaceChildren();
  if(state.selected===null){
    const m=el('span','muted');
    m.append('点雷达上的飞机查看 ——', document.createElement('br'), '机型 / 注册 / 高度 / 距离 / 方位');
    d.append(m); return;
  }
  const t=TARGETS[state.selected]; const g=targetGeom(t);
  const relTxt=(g.rel>=0?'右 ':'左 ')+Math.abs(Math.round(g.rel))+'°';
  const head=el('div');
  head.append(el('span','dt-cs',t.cs),' ',el('span','dt-type',t.type),' ',el('span','muted',t.desc));
  const sub=el('div','muted',t.model+' · '+t.reg);
  const tbl=el('table');
  const vsArrow=t.vs>50?'↑':(t.vs<-50?'↓':'');
  const rows=[
    ['相对高度',(t.relAlt>=0?'+':'')+t.relAlt+' ft '+vsArrow],
    ['距离',t.dist.toFixed(1)+' NM'],
    ['磁方位',Math.round(g.brgMag)+'° (真北 '+t.brgTrue+'°)'],
    ['相对机头',relTxt],
    ['地速',t.gs+' kt'],
  ];
  rows.forEach(([k,v])=>{ const tr=el('tr'); tr.append(el('td',null,k),el('td',null,v)); tbl.append(tr); });
  d.append(head,sub,tbl);
}

function refresh(){
  document.getElementById('hdg-val').textContent=String(Math.round(state.hdg)).padStart(3,'0')+'°';
  document.getElementById('var-val').textContent=(state.magvar<0?'−':'+')+Math.abs(state.magvar)+'°';
  draw(); renderDetail();
}

document.getElementById('seg-orient').addEventListener('click',e=>{
  if(!e.target.dataset.v) return;
  state.orient=e.target.dataset.v;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target)); refresh();
});
document.getElementById('seg-range').addEventListener('click',e=>{
  if(!e.target.dataset.v) return;
  state.range=+e.target.dataset.v;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target)); refresh();
});
document.getElementById('hdg').addEventListener('input',e=>{ state.hdg=+e.target.value; refresh(); });
document.getElementById('magvar').addEventListener('input',e=>{ state.magvar=+e.target.value; refresh(); });
document.getElementById('show-fov').addEventListener('change',e=>{ state.showFov=e.target.checked; refresh(); });
document.getElementById('show-true').addEventListener('change',e=>{ state.showTrue=e.target.checked; refresh(); });

let dragging=false,lastA=0;
function angleAt(ev){
  const r=cv.getBoundingClientRect();
  const x=(ev.clientX-r.left)/r.width*W-CX;
  const y=(ev.clientY-r.top)/r.height*H-CY;
  return Math.atan2(y,x)*180/Math.PI;
}
cv.addEventListener('mousedown',ev=>{
  const r=cv.getBoundingClientRect();
  const x=(ev.clientX-r.left)/r.width*W, y=(ev.clientY-r.top)/r.height*H;
  let hit=null,best=18;
  TARGETS.forEach((t,i)=>{ const dd=Math.hypot(t._sx-x,t._sy-y); if(dd<best){best=dd;hit=i;} });
  if(hit!==null){ state.selected=hit; refresh(); return; }
  dragging=true; lastA=angleAt(ev);
});
window.addEventListener('mousemove',ev=>{
  if(!dragging) return;
  const a=angleAt(ev); let dd=a-lastA; lastA=a;
  state.hdg=norm360(state.hdg+dd);
  document.getElementById('hdg').value=Math.round(state.hdg); refresh();
});
window.addEventListener('mouseup',()=>dragging=false);

refresh();
</script>
</body>
</html>
