name: Deploy ESP32-P4 firmware updater

on:
  workflow_run:
    workflows:
      - Release ESP32-P4 firmware
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Release ESP32-P4 firmware run ID to deploy"
        required: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "esp32p4-pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy firmware updater to GitHub Pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Pages site artifact
        uses: actions/download-artifact@v4
        with:
          name: pilot-kit-box-esp32p4-pages-site
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
